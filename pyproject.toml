[project]
name = "support-data-quality-pipeline"
version = "1.0.0"
description = "Resumable Service Desk data-quality pipeline for CSV, JSON Lines, and Parquet exports."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "psycopg[binary,pool]>=3.3,<4",
  "pyarrow>=23,<24",
  "pydantic>=2.12,<3",
  "pyyaml>=6,<7",
  "typer>=0.21,<1",
]

[project.scripts]
support-data-quality = "support_data_quality.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.19,<3",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.15,<1",
  "types-pyyaml>=6,<7",
]

[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_data_quality"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "S", "PTH"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["support_data_quality"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = ["integration: requires PostgreSQL"]

[tool.coverage.run]
source = ["support_data_quality"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
